# -*- conf -*-
# Foot terminal configuration migrated from ~/.config/wezterm/wezterm.lua

[main]
shell=/usr/bin/zsh -l
login-shell=yes
term=foot

# Font configuration with fallbacks and feature disables (calt=0, liga=0)
font=JetBrainsMono Nerd Font:size=13:fontfeatures=calt=0:fontfeatures=liga=0, Symbols Nerd Font:size=13, Noto Sans Mono CJK SC:size=13, Noto Sans Mono CJK HK:size=13, Noto Sans Mono CJK JP:size=13, Noto Sans Mono CJK KR:size=13, Noto Sans Mono CJK TC:size=13
font-size-adjustment=0.5

# Replicate WezTerm's cell_width = 0.88 and line_height = 0.9 metrics
letter-spacing=-1px
line-height=18px

# Padding (0px on all sides)
pad=0x0

# Initial color theme
initial-color-theme=light

[scrollback]
lines=10000

[cursor]
style=block
blink=no

[colors-dark]
background=ededcc
foreground=000000
cursor=ededcc 000000
selection-foreground=000000
selection-background=ecf024

# Normal ANSI colors (0-7)
regular0=696c77
regular1=e45649
regular2=50a14f
regular3=c18401
regular4=199aa6
regular5=a626a4
regular6=0184bc
regular7=a0a1a7

# Bright ANSI colors (8-15)
bright0=696c77
bright1=e45649
bright2=50a14f
bright3=c18401
bright4=199aa6
bright5=a626a4
bright6=0184bc
bright7=a0a1a7

[colors-light]
background=ededcc
foreground=000000
cursor=ededcc 000000
selection-foreground=000000
selection-background=ecf024

regular0=696c77
regular1=e45649
regular2=50a14f
regular3=c18401
regular4=199aa6
regular5=a626a4
regular6=0184bc
regular7=a0a1a7

bright0=696c77
bright1=e45649
bright2=50a14f
bright3=c18401
bright4=199aa6
bright5=a626a4
bright6=0184bc
bright7=a0a1a7

[key-bindings]
# Spawn new window: Ctrl+Alt+Return
spawn-terminal=Control+Mod1+Return

# Copy/Paste: Ctrl+Alt+c / Ctrl+Alt+v
clipboard-copy=Control+Mod1+c
clipboard-paste=Control+Mod1+v

# Font size controls: Ctrl+Alt+k / Ctrl+Alt+j / Ctrl+Alt+h
font-increase=Control+Mod1+k
font-decrease=Control+Mod1+j
font-reset=Control+Mod1+h

# Scroll
scrollback-up-half-page=Mod4+k
scrollback-down-half-page=Mod4+j

# Search and copy from scrollback using fuzzel: Ctrl+Alt+u
pipe-scrollback=[sh -c "fuzzel --dmenu -p 'Search: ' -l 20 | tr -d '\n' | wl-copy"] Control+Mod1+u

# Search
search-start=Control+Mod1+s

# Extract URLs from scrollback and copy using fuzzel: Ctrl+Alt+o
pipe-scrollback=[sh -c "xurls | sort -u | fuzzel --dmenu -p 'Copy which url?' -l 10 | tr -d '\n' | wl-copy"] Control+Mod1+o

# Extract JSON from scrollback and copy using fuzzel: Ctrl+Shift+j
pipe-scrollback=[sh -c "python3 ~/.config/foot/extract_json.py | fuzzel --dmenu -p 'Copy which json?' -l 10 | tr -d '\n' | wl-copy"] Control+Shift+j

[text-bindings]
# Remap control sequences
\x1b[27;5;9~=Control+Tab
\x1b[27;6;9~=Control+Shift+Tab
\x1b\x0d=Shift+Return

[mouse-bindings]
# Block text selection: Ctrl+LeftClick
select-begin-block=Control+BTN_LEFT
