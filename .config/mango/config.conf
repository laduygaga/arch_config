# ==============================================================================
# MangoWM Configuration for user `mango`
# Migrated & adapted from user `duy`'s dwm setup
# ==============================================================================

# ------------------------------------------------------------------------------
# Environment & Input Method (Fcitx5 / Wayland)
# ------------------------------------------------------------------------------
env=GTK_IM_MODULE,fcitx
env=QT_IM_MODULE,fcitx
env=XMODIFIERS,@im=fcitx
env=XDG_CURRENT_DESKTOP,mango
env=XDG_SESSION_TYPE,wayland
env=MOZ_ENABLE_WAYLAND,1
env=QT_QPA_PLATFORM,wayland;xcb

# ------------------------------------------------------------------------------
# Keyboard Settings (Swap Ctrl & CapsLock)
# ------------------------------------------------------------------------------
xkb_rules_options=ctrl:swapcaps

# ------------------------------------------------------------------------------
# Performance & Animations (Disabled for maximum speed)
# ------------------------------------------------------------------------------
animations=0
animation_type_open=none
animation_type_close=none

# ------------------------------------------------------------------------------
# Monitor Configuration (Set hardware display refresh to 165Hz)
# ------------------------------------------------------------------------------
monitor_rule=name:DP-1,width:1920,height:1080,refresh:165,x:0,y:0,scale:1
monitor_rule=name:DP-2,width:1920,height:1080,refresh:165,x:0,y:0,scale:1
monitor_rule=name:DisplayPort-1,width:1920,height:1080,refresh:165,x:0,y:0,scale:1
monitor_rule=name:*,width:1920,height:1080,refresh:165,x:0,y:0,scale:1

# ------------------------------------------------------------------------------
# Layout & Appearance Settings
# ------------------------------------------------------------------------------
border_px=3
border_color=0x444444ff
focus_color=0x00A5FFff
root_color=0x222222ff

# Gap Settings (Disabled for flush alignment with statusbar & screen edges)
gap_inner_horizontal=0
gap_inner_vertical=0
gap_outer_horizontal=0
gap_outer_vertical=0
monocle_no_gap=1
smart_gaps=1

# Monocle Tabbed Layout Mode
monocle_tab_mode=1

# Tab Bar Customization (Compact & Sleek Tabs for Monocle layout)
tab_bar_decorate_focus_bg_color=0xededccFF
tab_bar_decorate_focus_fg_color=0x000000FF
tab_bar_height=18
tab_bar_decorate_font_desc=monospace 9
tab_bar_decorate_border_width=0
tab_bar_decorate_padding_x=0
tab_bar_decorate_padding_y=0
tab_bar_decorate_corner_radius=0

# Tag Rules (Set Monocle Tabbed layout as default across all tags)
tag_rule=id:*,layout_name:monocle,master_factor:0.55

# ------------------------------------------------------------------------------
# Autostart Background Services
# ------------------------------------------------------------------------------
exec_once=fcitx5 -d
exec_once=mangobar
exec_once=dunst
exec_once=swaybg -c "#222222"
exec_once=wl-clip-persist --clipboard regular

# ------------------------------------------------------------------------------
# Window Rules (Exact match from duy's dwm config.h)
# ------------------------------------------------------------------------------
# Tag 2 (1 << 1): Web Browsers
window_rule=tags:2,app_id:qutebrowser
window_rule=tags:2,app_id:chromium
window_rule=tags:2,app_id:google-chrome
window_rule=tags:2,app_id:Google-chrome

# Tag 3 (1 << 2): Reference & Firefox
window_rule=tags:3,app_id:firefox
window_rule=tags:3,app_id:GoldenDict

# Tag 4 (1 << 3): Gaming
window_rule=tags:4,is_floating:1,app_id:dota2
window_rule=tags:4,app_id:csgo_linux64
window_rule=tags:4,app_id:hl_linux
window_rule=tags:4,app_id:Condition Zero
window_rule=tags:4,title:Raid

# Tag 6 (1 << 5): Steam & Wine Launchers
window_rule=tags:6,app_id:steam
window_rule=tags:6,app_id:Lutris
window_rule=tags:6,is_floating:1,app_id:battle.net.exe
window_rule=tags:6,app_id:explorer.exe
window_rule=tags:6,app_id:gods.exe
window_rule=tags:6,app_id:leagueclientux.exe
window_rule=tags:6,app_id:hearthstone.exe
window_rule=tags:6,app_id:riotclientux.exe
window_rule=tags:6,app_id:riot client.exe
window_rule=tags:6,app_id:league of legends.exe
window_rule=tags:6,app_id:immutable.exe

# Tag 7 (1 << 6): Virtual Machines
window_rule=tags:7,app_id:Qemu-system-x86_64

# Tag 8 (1 << 7): Messaging & Media
window_rule=tags:8,app_id:TelegramDesktop
window_rule=tags:8,app_id:mpv
window_rule=tags:8,title:ncmpcpp

# Tag 9 (1 << 8): Documents / Readers
window_rule=tags:9,app_id:Zathura
window_rule=tags:9,app_id:Evince
window_rule=tags:9,app_id:FBReader

# Terminal Window Identification (Terminal Swallow)
window_rule=is_term:1,app_id:St
window_rule=is_term:1,app_id:Alacritty
window_rule=is_term:1,app_id:URxvt
window_rule=is_term:1,app_id:foot
window_rule=is_term:1,app_id:wezterm

# Floating Utility Windows
window_rule=is_floating:1,title:trans
window_rule=is_floating:1,title:S-Project
window_rule=is_floating:1,title:Event Tester

# ------------------------------------------------------------------------------
# Keybindings (dwm Alt-Modifier shortcuts)
# ------------------------------------------------------------------------------
# Core Commands & Navigation
bind=ALT,Return,spawn,wezterm
bind=ALT+SHIFT,Return,spawn,st -e tmux
bind=ALT,d,spawn,rofi -show drun -modi drun,run
bind=ALT,q,killclient
bind=ALT,b,spawn_shell,pkill -USR1 mangobar
bind=ALT+SHIFT,e,quit
bind=ALT+SHIFT,r,reload_config

# Stack Focus & Movement
bind=ALT,j,focusstack,next
bind=ALT,k,focusstack,prev
bind=ALT,Tab,focuslast
bind=ALT+SHIFT,j,exchange_stack_client,next
bind=ALT+SHIFT,k,exchange_stack_client,prev
bind=ALT,h,setmfact,-0.05
bind=ALT,l,setmfact,+0.05
bind=ALT,space,zoom
bind=ALT+SHIFT,space,togglefloating
bind=ALT,f,togglefullscreen

# Layout Switching (Exact dwm bindings)
bind=ALT,t,setlayout,monocle
bind=ALT+SHIFT,t,setlayout,floating
bind=ALT,u,setlayout,grid
bind=ALT,y,setlayout,centeredmaster
bind=ALT+SHIFT,y,setlayout,centeredfloatingmaster
bind=ALT+SHIFT,u,setlayout,tile
bind=ALT,o,setlayout,scroller

# Mouse Bindings (Hold Alt + Left Click to move/float, Alt + Right Click to resize)
mousebind=ALT,btn_left,moveresize,curmove
mousebind=ALT,btn_right,moveresize,curresize
mousebind=ALT,btn_middle,togglefloating

# Tags 1..9 Navigation
bind=ALT,1,view,1
bind=ALT,2,view,2
bind=ALT,3,view,3
bind=ALT,4,view,4
bind=ALT,5,view,5
bind=ALT,6,view,6
bind=ALT,7,view,7
bind=ALT,8,view,8
bind=ALT,9,view,9

bind=ALT+SHIFT,1,tag,1
bind=ALT+SHIFT,2,tag,2
bind=ALT+SHIFT,3,tag,3
bind=ALT+SHIFT,4,tag,4
bind=ALT+SHIFT,5,tag,5
bind=ALT+SHIFT,6,tag,6
bind=ALT+SHIFT,7,tag,7
bind=ALT+SHIFT,8,tag,8
bind=ALT+SHIFT,9,tag,9

# Scratchpad
bind=ALT,minus,toggle_scratchpad

# Media & Custom Tools
bind=ALT,p,spawn,mpc toggle
bind=ALT,bracketleft,spawn,mpc prev
bind=ALT,bracketright,spawn,mpc next
bind=ALT+SHIFT,p,spawn,dbus-send --print-reply --dest=org.mpris.MediaPlayer2.spotify /org/mpris/MediaPlayer2 org.mpris.MediaPlayer2.Player.PlayPause
bind=ALT+SHIFT,bracketleft,spawn,dbus-send --print-reply --dest=org.mpris.MediaPlayer2.spotify /org/mpris/MediaPlayer2 org.mpris.MediaPlayer2.Player.Previous
bind=ALT+SHIFT,bracketright,spawn,dbus-send --print-reply --dest=org.mpris.MediaPlayer2.spotify /org/mpris/MediaPlayer2 org.mpris.MediaPlayer2.Player.Next
bind=ALT,n,spawn,wezterm -e ncmpcpp
bind=ALT,w,spawn,$BROWSER

# System & Audio Keybindings
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=ALT,F11,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind=ALT,F9,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=ALT,F10,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=ALT,F8,spawn,/home/duy/gits/arch_config/scripts/toggle-card-profile.sh switch_sink
bind=ALT,F7,spawn,/home/duy/gits/arch_config/scripts/toggle-card-profile.sh toggle_jbl_go_mic

# Wayland Screenshots (grim + slurp) & OCR
bind=NONE,Print,spawn_shell,grim -g "$(slurp)" - | wl-copy
bind=ALT,Insert,spawn_shell,grim -g "$(slurp)" - | wl-copy
bind=ALT,F12,spawn_shell,filepath=~/Pictures/ScreenShots/$(date +'%b%d_%H%M%S').png && grim -g "$(slurp)" "$filepath" && tesseract "$filepath" - -l eng quiet | wl-copy
bind=ALT+SHIFT,F12,spawn_shell,lang=$(echo -e "vie\nchi_sim\njpn" | rofi -dmenu -p "Select OCR Language") && filepath=~/Pictures/ScreenShots/$(date +'%b%d_%H%M%S').png && grim -g "$(slurp)" "$filepath" && tesseract "$filepath" - -l "$lang" quiet | wl-copy

# Power & Display Management
bind=ALT,F2,spawn,swaylock
bind=ALT+SHIFT,F4,spawn,systemctl suspend
bind=ALT,Delete,spawn,wlr-dpms off
