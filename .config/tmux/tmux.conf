# Set prefix to Ctrl-a (like screen, easier than Ctrl-b)
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix

# Enable mouse support (optional, but useful for scrolling)
set -g mouse on

# Start numbering at 1 (Vim-like, 0 feels off)
set -g base-index 1
setw -g pane-base-index 1

# True color support for Vim inside tmux
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Vim-style pane splitting
bind v split-window -h  # Vertical split (like :vsplit)
bind s split-window -v  # Horizontal split (like :split)
unbind '"'             # Remove defaults
unbind %

# Vim-style pane navigation (h,j,k,l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style window switching (like buffer switching)
bind -r C-h previous-window  # Ctrl-h to go left
bind -r C-l next-window      # Ctrl-l to go right

# Resize panes with Vim keys (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Enter copy mode with Vim-like binding
bind Escape copy-mode       # Enter copy mode with Esc (Vim-like)
bind -T copy-mode-vi v send-keys -X begin-selection  # 'v' to start visual mode
bind -T copy-mode-vi y send-keys -X copy-selection   # 'y' to yank
bind -T copy-mode-vi Escape send-keys -X cancel     # Escape to exit
set -g mode-keys vi         # Use Vim keybindings in copy mode

# Faster escape time (crucial for Vim responsiveness)
set -sg escape-time 0       # No delay when pressing Esc in Vim

# Reload config with a Vim-like command
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Increase scrollback for large Vim sessions
set -g history-limit 50000

# Optional: Simple status bar (Vim users often prefer minimal)
set -g status-bg colour235
set -g status-fg white
set -g status-left " [#S] "
set -g status-right "#W %H:%M "
set -g window-status-current-style fg=green,bold


# make c-tab(mapping in neovim) work on tmux
set -s extended-keys on

