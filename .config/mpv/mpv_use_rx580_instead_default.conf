# .config/mpv

# vo=x11
sub-font-size=30
--ytdl-raw-options=write-sub=,write-auto-sub=,sub-lang=en
# save-position-on-quit  # or shift+q  instead of q

# Hardware Acceleration
hwdec=vaapi
vo=gpu

# High-Quality Rendering Pipeline
profile=gpu-hq
gpu-context=x11egl

# Smooth Playback & Performance Settings
hwdec-codecs=all
keep-open=yes
save-position-on-quit=yes
