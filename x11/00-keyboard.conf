#/etc/X11/xorg.conf.d/00-keyboard.conf
Section "InputClass"
    Identifier "system-keyboard"
    MatchIsKeyboard "on"
    Option "XkbLayout" "us"
    Option "XkbModel" "pc105" # Optional: Adjust if needed
    Option "XkbVariant" ""    # Optional: Adjust if needed
    Option "XkbOptions" "ctrl:swapcaps"
EndSection
